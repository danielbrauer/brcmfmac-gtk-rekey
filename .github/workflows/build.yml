name: Build test modules

on:
  push:
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [trace, retry]

    steps:
      - uses: actions/checkout@v5

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          grep -Fq '$CMDLINE_OPTS' scripts/arm-one-boot-test.sh
          python3 scripts/test-eapol-metadata.py
          python3 scripts/test-group-traffic.py
          python3 scripts/test-one-boot-loader.py
          python3 scripts/test-persistent-module.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential curl dpkg-dev flex \
            gcc-aarch64-linux-gnu libelf-dev libssl-dev xz-utils

      - name: Build ${{ matrix.variant }} module
        run: ./scripts/build.sh "${{ matrix.variant }}"

      - name: Verify module identity
        run: |
          actual_release="$(modinfo -F vermagic "dist/${{ matrix.variant }}/brcmfmac-${{ matrix.variant }}.ko" | awk '{print $1}')"
          echo "module kernel release: $actual_release"
          test "$actual_release" = "6.18.39+rpt-rpi-v8"
          modinfo "dist/${{ matrix.variant }}/brcmfmac-${{ matrix.variant }}.ko"

      - uses: actions/upload-artifact@v4
        with:
          name: brcmfmac-${{ matrix.variant }}-6.18.39-rpt-rpi-v8
          path: dist/${{ matrix.variant }}/
          if-no-files-found: error
